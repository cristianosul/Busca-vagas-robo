- name: Inspecionar boletim de vagas FGTAS RS
        run: |
          python -u - <<'PY'
          import re
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          import httpx

          base = "https://fgtas.rs.gov.br"
          url = urljoin(base, "/agencias-fgtas-sine-oferecem-6-392-vagas-de-emprego-oferecidas-nas-agencias-fgtas-sine")
          r = httpx.get(
              url,
              timeout=20,
              follow_redirects=True,
              headers={"User-Agent": "BuscaVagasBot/0.1 (+coleta respeitosa de vagas publicas)"},
          )
          soup = BeautifulSoup(r.text, "html.parser")
          article = soup.find("article") or soup.find("main") or soup
          text = re.sub(r"\n{3,}", "\n\n", article.get_text("\n", strip=True))
          print("Status:", r.status_code)
          print("--- TEXTO DO ARTIGO ---")
          print(text[:3500])

          print("\n--- LINKS / ANEXOS NO ARTIGO ---")
          for a in article.find_all("a", href=True):
              label = re.sub(r"\s+", " ", a.get_text(" ", strip=True))
              print(" -", label[:80], "->", urljoin(base, a["href"]))
          PY
