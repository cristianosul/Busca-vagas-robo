
name: Teste isolado FGTAS-SINE RS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgtas-sine-rs-isolated
  cancel-in-progress: false

jobs:
  coleta-publica-estadual:
    name: Coletar publicações públicas FGTAS/RS sem banco
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Conectar GitHub Actions ao Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.90.8.58

      - name: Configurar o celular como saída brasileira
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale set --exit-node=100.90.8.58
          echo "Exit Node configurado."
          tailscale status

      - name: Confirmar saída brasileira
        shell: bash
        run: |
          set -euo pipefail
          COUNTRY="$(curl --fail --silent --show-error --max-time 30 https://ipinfo.io/country | tr -d '\r\n')"
          echo "País de saída: $COUNTRY"
          if [ "$COUNTRY" != "BR" ]; then
            echo "::error::A saída não foi identificada como brasileira."
            exit 1
          fi

      - name: Configurar Python e dependências
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar somente dependências do coletor
        run: |
          python -m pip install --upgrade pip
          pip install "httpx>=0.27,<1" "beautifulsoup4>=4.12,<5"

      - name: Executar autoteste sem rede
        run: python -u fgtas_rs.py --self-test

      - name: Coletar publicações oficiais do RS
        run: |
          mkdir -p resultado-fgtas-rs
          python -u fgtas_rs.py --output resultado-fgtas-rs/fgtas_sine_rs.json

      - name: Disponibilizar JSON para conferência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-teste-fgtas-sine-rs
          path: resultado-fgtas-rs/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Mapear páginas internas e PDFs da FGTAS/RS
        run: python -u scripts/mapear_fgtas_interno.py

      - name: Testar acesso e mapear balcões das prefeituras do RS
        run: python -u scripts/testar_prefeituras_rs.py

      - name: Testar acesso e mapear balcões das prefeituras do RS
        run: |
          python -u scripts/testar_prefeituras_rs.py > prefeituras_rs.txt 2>&1 || true
          cat prefeituras_rs.txt

      - name: Testar acesso e mapear balcões das prefeituras do RS
        run: python -u scripts/testar_prefeituras_rs.py | tee prefeituras_rs.txt

      - name: Baixar resultado prefeituras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-prefeituras-rs
          path: prefeituras_rs.txt
      
      - name: Coletar oportunidades municipais RS
        env:
          URL_CAXIAS_FGTAS_SINE: "https://caxias.rs.gov.br/..."
          URL_NOVO_HAMBURGO_FGTAS_SINE: "https://www.novohamburgo.rs.gov.br/..."
        run: python -u scripts/coletar_prefeituras_rs.py --output resultado-fgtas-rs/prefeituras_rs.json

      - name: Coletar oportunidades municipais RS
        env:
          URL_CAXIAS_FGTAS_SINE: "COLE_A_URL_REAL_DE_CAXIAS_AQUI"
          URL_NOVO_HAMBURGO_FGTAS_SINE: "COLE_A_URL_REAL_DE_NOVO_HAMBURGO_AQUI"
        run: python -u scripts/coletar_prefeituras_rs.py --output resultado-fgtas-rs/prefeituras_rs.json

      - name: Upload dos resultados FGTAS e Prefeituras RS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-fgtas-rs
          path: resultado-fgtas-rs/

        
