name: Teste isolado FGTAS-SINE RS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgtas-sine-rs-isolated
  cancel-in-progress: false

jobs:
  coleta-publica-estadual:
    name: Testar fontes públicas FGTAS/SINE RS sem banco
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Conectar GitHub Actions ao Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: 100.90.8.58

      - name: Configurar saída brasileira
        shell: bash
        run: |
          set -euo pipefail
          sudo tailscale set --exit-node=100.90.8.58
          tailscale status

      - name: Confirmar país de saída
        shell: bash
        run: |
          set -euo pipefail
          COUNTRY="$(curl --fail --silent --show-error --max-time 30 https://ipinfo.io/country | tr -d '\r\n')"
          echo "País de saída: $COUNTRY"
          test "$COUNTRY" = "BR" || {
            echo "::error::A saída não foi identificada como brasileira."
            exit 1
          }

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install "httpx>=0.27,<1" "beautifulsoup4>=4.12,<5" "pyyaml>=6,<7" "pypdf>=5,<7"

      - name: Validar sintaxe e workflow
        run: |
          python -m py_compile fgtas_rs.py scripts/coletar_prefeituras_rs.py scripts/testar_prefeituras_rs.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path(".github/workflows/teste-fgtas-rs.yml").read_text(encoding="utf-8"))
          print("YAML carregado com sucesso.")
          PY

      - name: Executar autoteste FGTAS sem rede
        run: python -u fgtas_rs.py --self-test

      - name: Coletar publicações oficiais FGTAS/SINE
        run: |
          mkdir -p resultado-fgtas-rs
          python -u fgtas_rs.py --output resultado-fgtas-rs/fgtas_sine_rs.json

      - name: Validar regras municipais V3.5 sem rede
        run: python -u scripts/testar_prefeituras_rs.py

      - name: Coletar diagnóstico municipal V3.5
        run: python -u scripts/coletar_prefeituras_rs.py --pause 1 --output resultado-fgtas-rs/prefeituras_rs.json

      - name: Disponibilizar resultados para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-fgtas-sine-rs-v3-5
          path: |
            resultado-fgtas-rs/*.json
            prefeituras_rs.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
          
