- name: Inspecionar oportunidade-de-emprego FGTAS RS
  run: |
          python -u - <<'PY'
          import re
          from bs4 import BeautifulSoup
          import httpx

          url = "https://fgtas.rs.gov.br/oportunidade-de-emprego"
          r = httpx.get(
              url,
              timeout=20,
              follow_redirects=True,
              headers={"User-Agent": "BuscaVagasBot/0.1 (+coleta respeitosa de vagas publicas)"},
          )
          soup = BeautifulSoup(r.text, "html.parser")
          text = re.sub(r"\s+", " ", soup.get_text(" ", strip=True))
          print("Título:", soup.title.string.strip() if soup.title and soup.title.string else "sem título")
          print("Trecho texto:", text[:800])

          links = []
          for a in soup.find_all("a", href=True):
              label = re.sub(r"\s+", " ", a.get_text(" ", strip=True))
              href = a["href"]
              if any(k in (label + " " + href).lower() for k in ("vaga", "emprego", "sine", "fgtas", "boletim", "painel", ".pdf")):
                  links.append((label[:70], href))
          print(f"Links relevantes ({len(links)}):")
          for label, href in links[:25]:
              print(" -", label, "->", href)
          PY
