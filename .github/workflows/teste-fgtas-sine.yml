
name: Teste isolado FGTAS-SINE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fgtas-sine-isolated-test
  cancel-in-progress: false

jobs:
  test-fgtas-sine:
    name: Testar coletor FGTAS-SINE sem banco
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar somente dependências do coletor
        run: |
          python -m pip install --upgrade pip
          pip install "httpx>=0.27,<1" "beautifulsoup4>=4.12,<5" "pypdf>=5,<7"

      - name: Executar teste real do PDF oficial
        run: |
          python -u - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import fgtas_sine

          print("ETAPA 1: Consultando página oficial FGTAS/SINE...", flush=True)

          with fgtas_sine._client() as client:
              pdf_url, edition_date = fgtas_sine.find_latest_pdf(client)

              print(f"ETAPA 2: Edição encontrada: {edition_date}", flush=True)
              print(f"PDF oficial localizado: {pdf_url}", flush=True)

              today = datetime.now(
                  ZoneInfo("America/Sao_Paulo")
              ).date().isoformat()

              if edition_date != today:
                  raise RuntimeError(
                      f"Edição {edition_date} diferente da data atual {today}."
                  )

              print("ETAPA 3: Baixando PDF oficial...", flush=True)
              pdf_bytes = fgtas_sine.download_pdf(client, pdf_url)

          print(
              f"PDF baixado: {len(pdf_bytes)} bytes.",
              flush=True
          )

          print("ETAPA 4: Extraindo e validando vagas...", flush=True)

          payload = fgtas_sine.parse_jobs(
              pdf_bytes,
              edition_date,
              pdf_url
          )

          output = Path("resultado-fgtas-sine")
          output.mkdir(exist_ok=True)

          result_file = output / f"fgtas_sine_{edition_date}.json"
          result_file.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("ETAPA 5: Resultado da extração", flush=True)
          print(f"Registros: {payload['job_records']}", flush=True)
          print(
              f"Vagas anunciadas: {payload['announced_openings']}",
              flush=True
          )
          print(f"JSON gerado: {result_file}", flush=True)
          print("TESTE FGTAS/SINE CONCLUÍDO.", flush=True)
          PY

      - name: Disponibilizar resultado para conferência
        uses: actions/upload-artifact@v4
        with:
          name: resultado-teste-fgtas-sine
          path: resultado-fgtas-sine/*.json
          if-no-files-found: error
          retention-days: 7
