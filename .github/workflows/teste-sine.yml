name: Teste SINE

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias de diagnostico
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install "httpx[http2]" curl-cffi

      - name: Executar diagnostico SINE
        continue-on-error: true
        run: python -u scripts/diagnostico_sine.py

      - name: Descobrir rotas FGTAS e portais centralizados SINE/MTE
        continue-on-error: true
        run: python -u scripts/descobrir_fontes_sine.py
        
